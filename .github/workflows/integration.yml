name: Integration

on:
  push:
    paths:
      - "function lab.py"        # <-- the .py file that unittests1.py tests
      - "unittests1.py"
  pull_request:
    paths:
      - "function lab.py"        # <-- same file as above
      - "unittests1.py"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest unittests1.py -v